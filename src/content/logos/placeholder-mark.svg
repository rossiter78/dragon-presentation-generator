<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deck mark">
  <!-- Placeholder mark. Replace with your own and keep the square aspect:
       Chrome.tsx renders it small in the corner, and make-qr.mjs can drop it
       into the centre of a QR code, which wants something square.

       ONE SHAPE, WITH REAL HOLES. The D is knocked out of the square with
       fill-rule="evenodd" rather than painted over it in a second colour,
       and that is what lets talk.config.ts tint it: the corner mark is drawn
       with a CSS mask, which reads this file's ALPHA and ignores its colour,
       so a mark painted in two opaque colours would mask to a solid square
       and lose its own design. Holes survive; a second fill does not.

       The colour below is therefore only used where the file is drawn
       directly rather than masked — inside a generated QR code, and in
       whatever opens it when you double-click it. Graphite because a QR
       panel is white and a mark has to read on it. -->
  <path fill="#2B3440" fill-rule="evenodd" d="
    M14 0 H50 A14 14 0 0 1 64 14 V50 A14 14 0 0 1 50 64 H14 A14 14 0 0 1 0 50 V14 A14 14 0 0 1 14 0 Z
    M20 44 V20 h10 a12 12 0 0 1 0 24 H20 Z
    M30 27.5 a4.5 4.5 0 1 0 0 9 a4.5 4.5 0 1 0 0 -9 Z
  "/>
</svg>
