<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same art as mark.svg, but this one is never masked: it is drawn by the
       browser in the tab strip, outside the page, where no theme token can
       reach it. So it carries its own two-scheme colouring instead — a tab
       strip is light or dark depending on the reader's OS, and a single fixed
       colour is unreadable on one of them.

       This is a plain media query inside the file. No script, no second
       asset, nothing fetched. -->
  <style>
    .plate { fill: #2B3440 }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #E8EAED }
    }
  </style>
  <path class="plate" fill-rule="evenodd" d="
    M14 0 H50 A14 14 0 0 1 64 14 V50 A14 14 0 0 1 50 64 H14 A14 14 0 0 1 0 50 V14 A14 14 0 0 1 14 0 Z
    M20 44 V20 h10 a12 12 0 0 1 0 24 H20 Z
    M30 27.5 a4.5 4.5 0 1 0 0 9 a4.5 4.5 0 1 0 0 -9 Z
  "/>
</svg>
